name: Recolha diária de preços
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Correr job
        working-directory: backend
        env:
          POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
          POKETRACE_PLAN:    ${{ vars.POKETRACE_PLAN || 'free' }}
          PPT_API_KEY:       ${{ secrets.PPT_API_KEY }}
          PPT_PLAN:          ${{ vars.PPT_PLAN || 'free' }}
          DB_PATH: pokevalor.db
          OUTPUT_JSON: ../dados.json
          ITENS_JSON: ../itens.json
        run: python job.py
      - name: Guardar resultados no repositório
        run: |
          git config user.name "pokevalor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json backend/pokevalor.db
          git diff --quiet --cached || git commit -m "Preços de $(date -u +%F)"
          git push
