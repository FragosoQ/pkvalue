*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,.d{font-family:Sora,Inter,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--acc);color:#1a1300;display:grid;place-items:center;font-family:Sora;font-weight:700}
.sub{font-size:12px;color:var(--tx2)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--tx);display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:linear-gradient(135deg,#1A2233,#0F141C);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi small{display:block;color:var(--tx2);font-size:13px;margin-bottom:4px}.kpi b{font-family:Sora;font-size:24px;font-weight:600}
.sq{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-family:Sora;font-size:19px;font-weight:700;flex:none;color:#0B0E14}.sq.buy{background:#D9F2E3;color:#155A35}.sq.watch{background:#FBE8CC;color:#7A4A05}.sq.avoid{background:#FBDADD;color:#7A1F27}.sq.none{background:var(--s3);color:var(--sub)}.sq.early{background:#DCE7F7;color:#1E3F6B}
.sg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.sg .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg .m{font-size:12.5px;color:var(--tx2)}.sg .r{text-align:right;flex:none}.sg .v{font-weight:600;font-size:14px}
.brk{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}.brk .tt{font-weight:600;font-size:14px;margin-bottom:8px}.brk .g{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13px;color:var(--tx2)}.brk .bar{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}.brk .bar i{display:block;height:100%;background:var(--tx)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.kv div{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px}.kv small{display:block;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.kv b{font-family:Sora;font-size:17px}
.up{color:var(--green)}.down{color:var(--red)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}.sec h2{font-size:17px}.sec a{font-size:13px;text-decoration:none;color:var(--tx2)}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}.hs::-webkit-scrollbar{display:none}
.tile{flex:0 0 150px;scroll-snap-align:start;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.tile .img{height:190px;background:var(--s2);display:grid;place-items:center;position:relative}.tile img{width:100%;height:100%;object-fit:contain;padding:8px}
.ph{color:var(--tx3);font-size:32px}
.tile .body{padding:10px 12px}.tile .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .m{font-size:11px;color:var(--tx2);margin-top:2px}
.badge{position:absolute;top:8px;left:8px;font-family:Sora;font-weight:700;font-size:13px;padding:4px 8px;border-radius:8px;color:#0B0E14}
.b-buy{background:var(--green)}.b-watch{background:var(--amber)}.b-avoid{background:var(--red)}
.v-buy{color:var(--green)}.v-watch{color:var(--amber)}.v-avoid{color:var(--red)}.v-none{color:var(--sub)}.v-early{color:var(--blue)}
.hz{display:flex;gap:8px;margin:10px 0 4px}.hz button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--sub);font-size:13px;font-weight:600}.hz button.on{background:var(--acc);color:#0B0E14;border-color:var(--acc)}
.edge{font-family:Sora;font-size:26px;font-weight:700;line-height:1.1}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.row .th{width:52px;height:70px;border-radius:8px;background:var(--s2);flex:none;overflow:hidden;display:grid;place-items:center}.row .th img{width:100%;height:100%;object-fit:contain}
.row .t{flex:1;min-width:0}.row .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m{font-size:12px;color:var(--tx2)}
.ring{width:52px;height:52px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Sora;font-size:15px}
.ring.lg{width:84px;height:84px}.ring.lg b{font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(11,14,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
nav button{background:none;border:0;color:var(--tx3);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;font-family:inherit}
nav button.on{color:var(--tx)}nav button svg{width:22px;height:22px}
nav .cam{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#1a1300;margin:-26px auto 0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(245,200,66,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}.sheet-bg.open{display:flex}
.sheet{background:var(--s1);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px 28px;border:1px solid var(--line);border-bottom:0}
.grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px}
label{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select option{background:var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#1a1300;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--line)}.btn.dg{background:transparent;color:var(--red);border:1px solid var(--red)}.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn:active{transform:scale(.98)}
.fac{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--tx2)}
.fac .fl{cursor:pointer;display:flex;align-items:center;gap:5px}.fac .fl:after{content:'?';font-size:9px;width:13px;height:13px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);flex:none}
.fac .fl.on:after{background:var(--acc);color:#0B0E14;border-color:var(--acc)}

.prev{width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:var(--s2)}

.empty{text-align:center;color:var(--tx2);padding:30px 10px}
.hide{display:none}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}

.lb.open{display:grid}
.lb>div{width:100%;max-width:520px}
.lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:12px;display:block;margin:0 auto}
.lb .cap{color:#E8ECF3;text-align:center;font-size:13px;margin-top:12px;opacity:.85}

.zoomi{position:absolute;right:4px;bottom:4px;background:rgba(11,14,20,.75);color:#E8ECF3;font-size:10px;border-radius:6px;padding:2px 5px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--s3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;display:none;max-width:90%}

/* ================= pontuação (igual ao backend/scoring.py) ================= */
const SELADO=['Booster box','Booster pack','ETB','Coleção / Tin'];
const obsOrd=it=>[...(it.obs||[])].filter(o=>o.preco!=null).sort((a,b)=>a.data.localeCompare(b.data));
const JANELA=90,MINDIAS=21;   /* iguais a backend/scoring.py */
const diasEntre=(a,b)=>Math.round((new Date(b.slice(0,10))-new Date(a.slice(0,10)))/864e5)||0;
function tend(it){/* retorno na janela móvel de 90 dias — não desde sempre */
  const o=obsOrd(it);if(!o.length)return{v:null,e:'sem_dados'};
  const u=o[o.length-1],ant=o.slice(0,-1);let b=null;
  for(const x of ant)if(diasEntre(x.data,u.data)>=JANELA)b=x;            /* a mais recente já com 90 dias */
  if(!b){const c=ant.filter(x=>diasEntre(x.data,u.data)>=MINDIAS);if(c.length)b=c[0]}
  if(b&&b.preco)return{v:(u.preco-b.preco)/b.preco*100,e:'ok'};
  const d=it.detalhe;                                                    /* média 30d do fornecedor, vinda do backend */
  if(d&&d.tendencia!=null&&d.tendencia_estado==='avg30d')return{v:d.tendencia,e:'avg30d'};
  return{v:null,e:'insuficiente'}}
function tendencia(it){return tend(it).v}
function precoAtual(it){const o=obsOrd(it);return o.length?o[o.length-1].preco:null}
function mesesDesde(iso){if(!iso)return null;const y=+iso.slice(0,4),m=iso.length>=7?+iso.slice(5,7):1;const h=new Date();return (h.getFullYear()-y)*12+(h.getMonth()+1-m)}
const SUB_MAX={producao:10,reimpressao:8,tipo_set:5,populacao:5,racio:2},ESC_MAX=30;
function escassez(it){ /* só contam os sub-fatores aplicáveis e com dados; o total é normalizado */
  if(it.esc_override)return{total:it.esc_override*6,override:true,sub:{}};
  const selado=SELADO.includes(it.tipo), sub={};
  sub.producao={v:{em:0,fim_anunciado:5,fora:10}[it.producao||'em']||0,estado:'ok'};
  const m=mesesDesde(it.ultima_reimpressao||(it.ano?it.ano+'-01':null));
  sub.reimpressao=m==null?{v:null,estado:'desconhecido'}:{v:Math.min(8,Math.floor(m/6)*2),estado:'ok'};
  sub.tipo_set={v:{principal:0,especial:3,promo:5}[it.tipo_set||'principal']||0,estado:'ok'};
  const p=it.pop_psa10;
  sub.populacao=selado?{v:null,estado:'na'}                      /* PSA gradua cartas, não caixas seladas */
    :(p==null||p==='')?{v:null,estado:'desconhecido'}
    :{v:p>5000?0:p>2000?1:p>1000?3:p>500?4:5,estado:'ok'};
  const r=it.racio;
  sub.racio=(r==null)?{v:null,estado:'desconhecido'}:{v:r,estado:'ok'};
  Object.keys(sub).forEach(k=>sub[k].max=SUB_MAX[k]);
  const ok=Object.values(sub).filter(x=>x.estado==='ok');
  const base=ok.reduce((a,x)=>a+x.v,0), baseMax=ok.reduce((a,x)=>a+x.max,0);
  return{total:baseMax?Math.round(ESC_MAX*base/baseMax):0,base,baseMax,sub}}
function score(it){const {v:tr,e}=tend(it);
  if(e==='sem_dados')return null;   /* sem qualquer preço não é "mau", é desconhecido — não se inventa um número */
  const pT=tr==null?12:Math.max(0,Math.min(30,15+tr/2));const pE=escassez(it).total;const pP=(it.proc||3)*4;
  const idade=new Date().getFullYear()-(+it.ano||new Date().getFullYear());const pI=Math.min(10,idade*2);const pTipo=SELADO.includes(it.tipo)?10:(it.tipo==='Set completo'?7:5);
  return Math.round(Math.min(100,pT+pE+pP+pI+pTipo))}
/* estado de cobertura do item: none = sem preços, early = com preço mas sem histórico que chegue */
function clsIt(it){const s=score(it);if(s==null)return'none';if(tend(it).e==='insuficiente')return'early';return s>=70?'buy':s>=50?'watch':'avoid'}
const ord=(a,b)=>(b.s==null?-1:b.s)-(a.s==null?-1:a.s);
const cls=s=>s==null?'none':s>=70?'buy':s>=50?'watch':'avoid';
const col=s=>s==null?'var(--s3)':s>=70?'var(--green)':s>=50?'var(--amber)':'var(--red)';
function ring(s,lg){const r=lg?36:22,c=2*Math.PI*r,sz=lg?84:52;return `<div class="ring ${lg?'lg':''}"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="var(--s3)" stroke-width="${lg?7:5}" fill="none"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="${col(s)}" stroke-width="${lg?7:5}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-(s||0)/100)}"/></svg><b>${s==null?'—':s}</b></div>`}
const thumb=it=>it.img?`<img src="${it.img}" alt="" loading="lazy">`:`<span class="ph">${SELADO.includes(it.tipo)?'▣':'▮'}</span>`;

/* ================= acerto (previsões vs. o que aconteceu) ================= */
let aval=null, hzSel=90;
function vAcerto(){
  const cab=`<div class="sec"><h2>${t('nav.acerto')}</h2></div><p class="sub" style="margin:0 0 12px">${t('avalhelp')}</p>`;
  if(!aval||!aval.resumo) return cab+`<div class="card empty">${t('avalnone')}</div>`;
  const hz=aval.resumo.map(r=>`<button class="${r.horizonte===hzSel?'on':''}" onclick="hzSel=${r.horizonte};render()">${r.horizonte}d</button>`).join('');
  const r=aval.resumo.find(x=>x.horizonte===hzSel)||aval.resumo[0];
  const u=r.universo, C=r.vereditos['Comprar'];
  const pend=aval.pendentes||{n:0};
  if(!u.n) return cab+`<div class="hz">${hz}</div><div class="card empty">${t('avalwait')}${pend.diasParaPrimeira!=null?` · ${t('avalin')} ${pend.diasParaPrimeira} ${t('days')}`:''}</div>
    <div class="sub" style="margin-top:10px">${aval.totalPrevisoes} ${t('avalrec')} · ${pend.n} ${t('avalmat')}</div>`;
  const v=C&&C.vantagem!=null?C.vantagem:null;
  const linhas=['Comprar','Acompanhar','Evitar'].filter(k=>r.vereditos[k]).map(k=>{const d=r.vereditos[k];
    return `<tr><td><b class="v-${k==='Comprar'?'buy':k==='Evitar'?'avoid':'watch'}">${t(k==='Comprar'?'buy':k==='Evitar'?'avoid':'watch')}</b></td><td style="text-align:right">${d.n}</td>
      <td style="text-align:right" class="${d.media>0?'up':d.media<0?'down':''}">${pct(d.media)}</td>
      <td style="text-align:right">${d.acerto==null?'—':d.acerto+'%'}</td>
      <td style="text-align:right" class="${d.vantagem>0?'up':d.vantagem<0?'down':''}"><b>${pct(d.vantagem)}</b></td></tr>`}).join('');
  const casos=(aval.casos||[]).filter(c=>c.horizonte===hzSel).slice(0,25);
  return cab+`<div class="hz">${hz}</div>
  <div class="card" style="margin-top:6px"><div class="tag">${t('avaledge')}</div>
    <div class="edge ${v>0?'up':v<0?'down':''}" style="margin:6px 0 2px">${pct(v)}</div>
    <p class="sub" style="font-size:12.5px;margin:0">${t('avaledgeh')}</p></div>
  <table style="margin-top:14px"><tr class="sub"><td>${t('verdict')}</td><td style="text-align:right">n</td><td style="text-align:right">${t('avalret')}</td><td style="text-align:right">${t('avalhit')}</td><td style="text-align:right">${t('avaladv')}</td></tr>
    ${linhas}<tr class="sub"><td>${t('avaluni')}</td><td style="text-align:right">${u.n}</td><td style="text-align:right">${pct(u.media)}</td><td style="text-align:right">—</td><td style="text-align:right">—</td></tr></table>
  <p class="sub" style="font-size:12px;margin-top:8px">${t('avalnote')}</p>
  <div class="sec"><h2 style="font-size:15px">${t('avalcases')}</h2><span class="sub">${pend.n} ${t('avalmat')}</span></div>
  ${casos.length?`<table>${casos.map(c=>`<tr><td style="white-space:nowrap;font-size:11.5px">${c.data}</td><td>${c.nome.slice(0,26)}</td><td class="sub">${t(c.veredito==='Comprar'?'buy':c.veredito==='Evitar'?'avoid':'watch')} ${c.score}</td><td style="text-align:right" class="${c.retorno>0?'up':c.retorno<0?'down':''}"><b>${pct(c.retorno)}</b></td><td style="text-align:right">${c.acertou==null?'·':c.acertou?'✓':'✗'}</td></tr>`).join('')}</table>`:`<div class="sub">${t('avalwait')}</div>`}`}

/* ================= painel ================= */
let maisSug=6, maisCand=10;
function mais(qual,total,mostrados){ /* botão de expandir, com o que falta */
  return total>mostrados?`<button class="btn g sm vermais" style="margin-top:10px" onclick="${qual}+=20;render()">${t('showmore')} (+${total-mostrados})</button>`:''}
function vPainel(){
  const inv=compras.reduce((s,c)=>s+c.qtd*c.preco,0);
  const val=compras.reduce((s,c)=>{const it=itens.find(i=>i.id===c.itemId);const p=it?precoAtual(it):null;return s+(p==null?c.preco:p)*c.qtd},0);
  const roi=inv?(val-inv)/inv*100:null;
  const meus=itens.filter(i=>i.origem!=='descoberta'),desc=itens.filter(i=>i.origem==='descoberta');
  const top=meus.map(i=>({i,s:score(i)})).sort(ord), cand=desc.map(i=>({i,s:score(i)})).sort(ord);
  const sub=i=>{const e=escassez(i);const st=SELADO.includes(i.tipo)?t('st.sealed'):i.tipo;const extra=i.producao==='fora'?t('prod.fora').toLowerCase():i.producao==='fim_anunciado'?t('prod.fim').toLowerCase():i.pop_psa10?`PSA 10 pop ${i.pop_psa10}`:i.tipo_set==='especial'?t('ts.especial').split(' (')[0].toLowerCase():'';return `${st} · ${i.ano||'—'}${extra?' · '+extra:''}`};
  return `<div class="kpis"><div class="kpi"><small>${t('invest')}</small><b>${eur(inv)}</b></div><div class="kpi"><small>${t('cur')}</small><b>${eur(val)}</b></div>
    <div class="kpi"><small>${t('ret')}</small><b class="${roi>0?'up':roi<0?'down':''}">${pct(roi)}</b></div><div class="kpi"><small>${t('n')}</small><b>${itens.length} ${t('items')}</b></div></div>
  <div class="sec"><h2>${t('sug')}</h2><span class="sub">${meus.length}</span></div>
  ${top.length?`<div style="border-top:1px solid var(--line)">${top.slice(0,maisSug).map(({i,s})=>`<div class="sg" onclick="abrir('${i.id}')"><div class="sq ${clsIt(i)}">${s==null?'—':s}</div><div style="flex:1;min-width:0"><div class="n">${i.nome}</div><div class="m">${sub(i)}</div></div><div class="r"><div class="v v-${clsIt(i)}">${t(clsIt(i))}</div><div class="m">${eur(precoAtual(i))} · ${pct(tendencia(i))}</div></div></div>`).join('')}</div>${mais('maisSug',top.length,maisSug)}`
  :`<div class="card empty">${t('noitems')}</div>`}
  <div class="sec"><h2>${t('cand')}</h2><span class="sub">${desc.length}</span></div>
  ${cand.length?`<div style="border-top:1px solid var(--line)">${cand.slice(0,maisCand).map(({i,s})=>`<div class="sg"><div class="sq ${clsIt(i)}" onclick="abrir('${i.id}')">${s==null?'—':s}</div><div style="flex:1;min-width:0" onclick="abrir('${i.id}')"><div class="n">${i.nome}</div><div class="m">${sub(i)}</div></div><div class="r"><div class="m">${eur(precoAtual(i))} · ${pct(tendencia(i))}</div><div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end"><button class="btn sm" style="padding:5px 10px" onclick="seguir('${i.id}')">${t('follow')}</button><button class="btn g sm" style="padding:5px 10px" onclick="ignorar('${i.id}')">✕</button></div></div></div>`).join('')}</div>${mais('maisCand',cand.length,maisCand)}`:`<div class="card empty">${t('nocand')}</div>`}`}
function seguir(id){const i=itens.find(x=>x.id===id);if(!i)return;i.origem='manual';render();toast(t('updated'));if(shOn()){const {obs,...item}=i;shPost({acao:'upsert_item',item:{...item,links:(i.links||[]).join(';')},obs:[]}).catch(e=>toast('Sheets: '+e.message))}}
function ignorar(id){itens=itens.filter(i=>i.id!==id);let ig=[];try{ig=JSON.parse(localStorage.getItem('pv-ignorados')||'[]')}catch(e){}ig.push(id);try{localStorage.setItem('pv-ignorados',JSON.stringify(ig))}catch(e){}render();if(shOn())shPost({acao:'del_item',id}).catch(e=>toast('Sheets: '+e.message))}
function brk(i){const e=escassez(i);if(e.override)return '';
  const r=[['prod','producao'],['reimp','reimpressao'],['tset','tipo_set'],['pop','populacao'],['ratio','racio']];
  return `<div class="brk"><div class="tt">${i.nome} · ${t('esc').toLowerCase()} ${e.total}/30</div>
    <div class="g">${r.map(([lbl,k])=>{const x=e.sub[k];
      /* uma barra a meio para "não sei" leria-se como "médio": mostra-se o motivo */
      return x.estado!=='ok'
        ? `<span>${t(lbl)}</span><span class="sub" style="grid-column:span 2;font-size:11.5px">${t(x.estado==='na'?'esc.na':'esc.nd')}</span>`
        : `<span>${t(lbl)}</span><div class="bar"><i style="width:${x.v/x.max*100}%"></i></div><span style="color:var(--tx)">${x.v}</span>`}).join('')}</div>
    <div class="sub" style="font-size:11.5px;margin-top:8px">${t('esc.norm')} ${e.base}/${e.baseMax} → ${e.total}/30</div></div>`}

let filtro='';
function vItens(){return `<div style="display:flex;gap:8px;margin-top:6px"><input placeholder="${t('search')}" value="${filtro}" oninput="filtro=this.value;document.getElementById('lst').innerHTML=lista()"><button class="btn sm" style="flex:none" onclick="abrirForm()">+ ${t('add')}</button></div><div id="lst" style="margin-top:14px">${lista()}</div>`}
function lista(){const l=itens.filter(i=>(i.nome+(i.set||'')).toLowerCase().includes(filtro.toLowerCase())).map(i=>({i,s:score(i)})).sort(ord);
  return l.length?`<div style="display:grid;gap:10px">${l.map(({i,s})=>`<div class="row" onclick="abrir('${i.id}')"><div class="th">${thumb(i)}</div><div class="t"><div class="n">${i.nome}</div><div class="m">${i.tipo} · ${i.set||'—'} · ${i.ano||'—'}${i.origem==='descoberta'?' · <span style="color:var(--acc)">'+t('candtag')+'</span>':''}</div><div class="m"><span class="v-${clsIt(i)}" style="font-weight:600">${t(clsIt(i))}</span> · ${eur(precoAtual(i))} · ${pct(tendencia(i))}</div></div>${ring(s)}</div>`).join('')}</div>`:`<div class="card empty">${t('noitems')}</div>`}

function fator(k,larg,val,pts){ /* linha clicável: barra, valor e explicação recolhida */
  return `<span class="fl" id="fl-${k}" onclick="explica('${k}')">${t(k)}</span><div class="bar"><i style="width:${larg}%"></i></div><b>${val}</b>
    <div class="ex" id="ex-${k}" hidden>${t('exp.'+k)}${pts==null?'':`<br><b style="color:var(--tx2)">${Math.round(pts)} ${t('ptsof')} ${MAXF[k]}</b>`}</div>`}
const MAXF={tend:30,esc:30,proc:20,age:10};
function explica(k){const ex=document.getElementById('ex-'+k),fl=document.getElementById('fl-'+k);

let foto=null,fotoUrl=null,matches=[],selM=0;
function vCam(){let key='';try{key=localStorage.getItem('pv-akey')||''}catch(e){}
  return `<div class="sec"><h2>${t('scan')}</h2><a href="#" onclick="go('painel');return false">← ${t('nav.painel')}</a></div><p class="sub" style="margin:0 0 12px">${t('scanhelp')}</p>

async function lerFoto(f){if(!f)return;foto=f;fotoUrl=URL.createObjectURL(f);
  const out=document.getElementById('camOut');out.innerHTML=`<img class="prev" src="${fotoUrl}" style="margin-top:12px"><div class="sub" style="margin:10px 0">${t('reading')}</div>`;
  let nome='',num=null,txt='';const key=(document.getElementById('akey')||{}).value;
  if(key){try{const j=await visao(f,key);nome=j.nome||'';num=j.numero&&j.numero.n?j.numero:null;txt=JSON.stringify(j)}catch(e){txt='vision: '+e.message}}
  if(!num&&typeof Tesseract!=='undefined'){try{const {data}=await Tesseract.recognize(f,'eng');txt=(txt?txt+'\n':'')+data.text;const m=data.text.match(/(\d{1,3})\s*[\/|]\s*(\d{2,3})/);if(m)num={n:+m[1],total:+m[2]};
    if(!nome){const l=data.text.split('\n').map(x=>x.trim()).filter(x=>/^[A-Z][A-Za-z'’.\- ]{2,24}$/.test(x)&&!/^(HP|Basic|Stage|Weakness|Resistance|Retreat)/i.test(x));nome=l[0]||''}}catch(e){}}
  await pesquisarCatalogo(nome,num,txt)}
async function visao(f,key){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:b64}},{type:'text',text:'Pokémon TCG card photo. Reply ONLY with JSON: {"nome":"card name","numero":{"n":123,"total":456},"set":"set name or null"}. Use null for unknown fields.'}]}]})});
  const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);const s=d.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();return JSON.parse(s)}
async function pesquisarCatalogo(nome,num,txt){const out=document.getElementById('camOut');let q='';
  if(num)q=`number:${num.n} set.printedTotal:${num.total}`;else if(nome)q=`name:"${nome}"`;
  matches=[];selM=0;if(q){try{matches=await tcg(q)}catch(e){}}
  if(!matches.length&&num&&nome){try{matches=await tcg(`name:"${nome}"`)}catch(e){}}
  out.innerHTML=(fotoUrl?`<img class="prev" src="${fotoUrl}" style="margin-top:12px">`:'')+
  (matches.length?`<div class="sec"><h2 style="font-size:15px">${t('found')}</h2></div>${matches.map((c,k)=>`<div class="match ${k===0?'sel':''}" onclick="selM=${k};document.querySelectorAll('.match').forEach((e,j)=>e.classList.toggle('sel',j===${k}))"><img src="${c.images.small}"><div><b>${c.name}</b> ${c.number}/${c.set.printedTotal}<div class="sub">${c.set.name} · ${c.set.releaseDate.slice(0,4)} · ${c.rarity||''}</div><div class="sub">${precoTcg(c)}</div></div></div>`).join('')}<button class="btn" style="margin-top:12px" onclick="addMatch()">${t('addthis')}</button>`
  :`<div class="sub" style="margin:10px 0">${t('nofound')}</div>`)+
  `<div style="display:flex;gap:8px;margin-top:10px"><input id="manualQ" placeholder="${t('manual')}" value="${nome}${num?' '+num.n+'/'+num.total:''}"><button class="btn g sm" style="flex:none" onclick="manualLookup()">${t('lookup')}</button></div>
  ${txt?`<details style="margin-top:10px"><summary class="sub">${t('ocr')}</summary><div class="mono">${txt.replace(/</g,'&lt;')}</div></details>`:''}`}
function precoTcg(c){const p=c.tcgplayer?.prices;const v=p?Object.values(p)[0]?.market:null;const cm=c.cardmarket?.prices?.trendPrice;return [v?`TCGplayer $${v}`:'',cm?`Cardmarket ${cm} €`:''].filter(Boolean).join(' · ')}
async function manualLookup(){const q=document.getElementById('manualQ').value.trim();const m=q.match(/(\d+)\s*\/\s*(\d+)/);const nome=q.replace(/\d+\s*\/\s*\d+/,'').trim();await pesquisarCatalogo(nome,m?{n:+m[1],total:+m[2]}:null,'')}
function addMatch(){const c=matches[selM];if(!c)return;const cm=c.cardmarket?.prices?.trendPrice;const tp=Object.values(c.tcgplayer?.prices||{})[0]?.market;

  ${FONTES.map(([n,u,dp,de])=>{const url=u(q);return `<div class="src"><h3>${n}</h3><p>${lang==='pt'?dp:de}</p><div style="display:flex;gap:8px"><a class="btn sm" style="text-decoration:none" href="${url}" target="_blank" rel="noopener">${t('open')}</a><button class="btn g sm" onclick="navigator.clipboard.writeText('${url}');toast(t('copied'))">${t('copy')}</button></div></div>`}).join('')}
  ${shCfg()}<div class="two" style="margin-top:10px"><button class="btn g" onclick="exportar()">${t('exp')}</button><label class="btn g" style="text-transform:none;letter-spacing:0;font-size:15px;margin:0">${t('imp')}<input type="file" accept="application/json" class="hide" onchange="importar(event)"></label></div>`}

/* ================= avaliar por nome ================= */
/* Cartas: o catálogo pokemontcg.io dá preço Cardmarket/TCGplayer.
   Selado: o catálogo não cobre e não há fonte gratuita (ver README 4e) — identifica-se
   o set e mostra-se o potencial calculável, sem inventar um preço. */
let avRes=null, avProc=3, avBusy=false, _sets=null;
const SEALED_PAT=[[/elite trainer box|\betb\b/i,'ETB'],[/booster box|\bdisplay\b/i,'Booster box'],
  [/booster bundle|booster pack|\bblister\b/i,'Booster pack'],[/\btin\b|collection box|premium collection|\bcollection\b/i,'Coleção / Tin']];
const ESPECIAIS=/151|celebrations|crown zenith|shining fates|hidden fates|champion's path|pokemon go|prismatic|shrouded|paldean fates|destined|anniversary/i;
const normSet=x=>(x||'').toLowerCase()
  .replace(/\b(pok[eé]mon|tcg|sword\s*&?\s*shield|scarlet\s*&?\s*violet|sun\s*&?\s*moon|xy|swsh|sv)\b/g,' ')
  .replace(/[^a-z0-9]+/g,' ').trim();
function tipoSelado(q){for(const [re,tp] of SEALED_PAT)if(re.test(q))return tp;return null}
async function sets(){if(_sets)return _sets;
  const r=await fetch('https://api.pokemontcg.io/v2/sets?pageSize=250&orderBy=-releaseDate');
  if(!r.ok)throw new Error('catálogo indisponível');
  return _sets=(await r.json()).data||[]}
function achaSet(nome){const alvo=normSet(nome);if(!alvo)return null;
  const l=_sets||[];let melhor=null,pts=-1;
  for(const st of l){const n=normSet(st.name);if(!n)continue;
    /* exato > contido > por palavras, para não devolver um set qualquer parecido */
    const p=n===alvo?3:(alvo.includes(n)||n.includes(alvo))?2:
      (n.split(' ').filter(w=>w.length>3&&alvo.includes(w)).length>=2?1:-1);
    if(p>pts){pts=p;melhor=st}}
  return pts>=1?melhor:null}
async function avaliar(){
  const q=(document.getElementById('avQ')||{}).value?.trim()||'';
  if(!q||avBusy)return; avBusy=true; avRes=null;
  const out=document.getElementById('avOut'); out.innerHTML=`<div class="sub" style="padding:10px 0">${t('av.load')}</div>`;
  try{
    const tp=tipoSelado(q);
    if(tp){ await sets();
      const st=achaSet(q.replace(/elite trainer box|booster box|booster bundle|booster pack|display|blister|premium collection|collection box|\betb\b|\btin\b|\bcollection\b/ig,' '));
      avRes={modo:'selado', tipo:tp, set:st, termo:q};
    } else {
      const m=q.match(/(\d{1,3})\s*\/\s*(\d{2,3})/);
      const nome=q.replace(/\d{1,3}\s*\/\s*\d{2,3}/,'').trim();
      let cs=[]; try{ cs=await tcg(m?`number:${m[1]} set.printedTotal:${m[2]}`:`name:"${nome}"`) }catch(e){}
      if(!cs.length&&nome){try{ cs=await tcg(`name:"${nome}"`)}catch(e){}}
      avRes={modo:'carta', cartas:cs, termo:q};
    }
  }catch(e){ avRes={erro:e.message} }
  avBusy=false; termo=q; render()}   /* o mesmo termo alimenta a avaliação E os links de confirmação */
function avItem(){ /* item provisório, pontuado com a MESMA fórmula do resto da app */
  if(!avRes||avRes.erro)return null;
  if(avRes.modo==='selado'){ const st=avRes.set; if(!st)return null;
    const ano=+((st.releaseDate||'').slice(0,4))||new Date().getFullYear();
    return {nome:`${st.name} ${avRes.tipo}`, tipo:avRes.tipo, set:st.name, ano, img:(st.images||{}).logo,
      tipo_set:(ESPECIAIS.test(st.name)||(st.printedTotal||999)<120)?'especial':'principal',
      producao:'em', proc:avProc, obs:[]}}
  const c=avRes.cartas&&avRes.cartas[0]; if(!c)return null;
  const cm=c.cardmarket?.prices?.trendPrice, tpz=Object.values(c.tcgplayer?.prices||{})[0]?.market;
  const obs=cm?[{data:hoje(),fonte:'Cardmarket',preco:cm}]:(tpz?[{data:hoje(),fonte:'TCGplayer',preco:tpz}]:[]);
  return {nome:`${c.name} ${c.number}/${c.set.printedTotal}`, tipo:'Carta', set:c.set.name,
    ano:+c.set.releaseDate.slice(0,4), img:c.images.large, notas:c.rarity||'',
    tipo_set:(ESPECIAIS.test(c.set.name)||(c.set.printedTotal||999)<120)?'especial':'principal',
    producao:'em', proc:avProc, obs, moeda:cm?'EUR':'USD'}}
function avHtml(){
  if(!avRes)return '';
  if(avRes.erro)return `<div class="card empty">${avRes.erro}</div>`;
  const it=avItem();
  if(!it)return `<div class="card empty">${t(avRes.modo==='selado'?'av.noset':'av.nocard')}</div>`;
  const e=escassez(it), idade=new Date().getFullYear()-(+it.ano||new Date().getFullYear());
  const pE=e.total, pP=(it.proc||3)*4, pI=Math.min(10,idade*2), pT=SELADO.includes(it.tipo)?10:(it.tipo==='Set completo'?7:5);
  const estim=pE+pP+pI+pT;                    /* 70 possíveis sem a tendência */
  const preco=it.obs&&it.obs.length?it.obs[0]:null;
  const linhas=[[t('esc'),pE,30],[t('proc'),pP,20],[t('age'),pI,10],[t('type'),pT,10]];
  return `<div class="card" style="margin-top:12px">
    <div style="display:flex;gap:12px;align-items:center">
      <div style="width:64px;height:64px;border-radius:10px;background:var(--s2);display:grid;place-items:center;overflow:hidden;flex:none">${it.img?`<img src="${it.img}" style="width:100%;height:100%;object-fit:contain">`:'<span class="ph">▣</span>'}</div>
      <div style="flex:1;min-width:0"><b style="font-size:15px">${it.nome}</b><div class="sub">${it.tipo} · ${it.set} · ${it.ano}</div></div></div>
    <div class="sec" style="margin-top:14px"><h2 style="font-size:14px">${t('av.price')}</h2></div>
    ${preco?`<div class="edge up" style="font-size:22px">${preco.preco} ${it.moeda==='EUR'?'€':'$'}</div><div class="sub" style="font-size:12px">${preco.fonte} · ${t('av.pricenote')}</div>`
      :`<div class="sub">${t('av.noprice')}</div>`}
    <div class="sec" style="margin-top:14px"><h2 style="font-size:14px">${t('av.pot')}</h2><span class="sub">${estim}/70</span></div>
    <div class="fac">${linhas.map(([l,v,m])=>`<span>${l}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}/${m}</b>`).join('')}</div>
    <div class="sub" style="font-size:12px;margin-top:10px">${t('av.missing')}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <span class="sub" style="font-size:12.5px;flex:none">${t('proc')}</span>
      <select onchange="avProc=+this.value;document.getElementById('avOut').innerHTML=avHtml()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===avProc?'selected':''}>${n}</option>`).join('')}</select>
    </div>
    <button class="btn" style="margin-top:12px" onclick="avSeguir()">${t('av.follow')}</button>
    <p class="sub" style="font-size:11.5px;margin:8px 0 0">${t('av.followh')}</p></div>`}
function avSeguir(){const it=avItem();if(!it)return;
  termo=it.nome; abrirForm(null,{...it,lang:'Inglês',links:[],notas:it.notas||''})}

/* ================= Google Sheets (Apps Script) ================= */
let SHEETS_URL='',SHEETS_TOKEN='';try{SHEETS_URL=localStorage.getItem('pv-sheets')||'';SHEETS_TOKEN=localStorage.getItem('pv-sheets-token')||''}catch(e){}
const shOn=()=>/^https:\/\/script\.google\.com\//.test(SHEETS_URL);
async function shGet(){const r=await fetch(SHEETS_URL+'?tipo=tudo&token='+encodeURIComponent(SHEETS_TOKEN)+'&t='+Date.now());const d=await r.json();if(d.erro)throw new Error(d.erro);
  const obsPor={};(d.obs||[]).forEach(o=>{(obsPor[o.item_id]=obsPor[o.item_id]||[]).push({id:o.id,data:String(o.data).slice(0,10),fonte:o.fonte||'',preco:Number(o.preco),origem:o.origem||'manual'})});
  const ig=ignorados();itens=(d.itens||[]).filter(i=>!ig.includes(i.id)).map(i=>({...i,ano:i.ano?+i.ano:null,proc:i.proc?+i.proc:3,pop_psa10:i.pop_psa10==null?null:+i.pop_psa10,esc_override:i.esc_override?+i.esc_override:null,links:i.links?String(i.links).split(';').filter(Boolean):[],obs:obsPor[i.id]||[]}));
  compras=(d.compras||[]).map(c=>({id:c.id,itemId:c.item_id,data:String(c.data).slice(0,10),qtd:+c.qtd||1,preco:Number(c.preco),estado:c.estado||'',local:c.local||''}))}
async function shPost(b){const r=await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify({...b,token:SHEETS_TOKEN})});const d=await r.json();if(d.erro)throw new Error(d.erro);return d}
function shCfg(){return `<div class="card" style="margin-top:14px"><div class="tag">Google Sheets</div><p class="sub" style="margin:6px 0 8px;font-size:12.5px">${t('shhelp')}</p>
  <input id="shUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${SHEETS_URL}"><input id="shTok" placeholder="token (opcional)" value="${SHEETS_TOKEN}" style="margin-top:8px">
  <button class="btn g sm" style="margin-top:8px" onclick="SHEETS_URL=document.getElementById('shUrl').value.trim();SHEETS_TOKEN=document.getElementById('shTok').value.trim();try{localStorage.setItem('pv-sheets',SHEETS_URL);localStorage.setItem('pv-sheets-token',SHEETS_TOKEN)}catch(e){};atualizar()">${t('shsave')}</button></div>`}

/* ================= dados.json / export ================= */
function ignorados(){try{return JSON.parse(localStorage.getItem('pv-ignorados')||'[]')}catch(e){return []}}
function fundir(d){const ig=ignorados();if(d.avaliacao!==undefined)aval=d.avaliacao;d.itens.filter(ri=>!ig.includes(ri.id)).forEach(ri=>{const k=itens.findIndex(i=>i.id===ri.id);const man=k>=0?(itens[k].obs||[]).filter(o=>o.fonte!=='auto'):(ri.obs||[]).filter(o=>o.fonte!=='auto');const auto=(ri.obs||[]).filter(o=>o.fonte==='auto'&&o.preco!=null);const novo={...(k>=0?itens[k]:{}),...ri,obs:[...man,...auto]};if(k>=0){novo.img=itens[k].img||ri.img;itens[k]=novo}else itens.push(novo)});
  (d.compras||[]).forEach(c=>{if(!compras.find(x=>x.id===c.id))compras.push({id:c.id,itemId:c.item_id||c.itemId,data:c.data,qtd:c.qtd,preco:c.preco,estado:c.estado,local:c.local})})}
async function atualizar(sil){if(shOn()){try{await shGet();render();document.getElementById('estado').textContent='Google Sheets · '+hoje();if(!sil)toast(t('updated'))}catch(e){toast('Sheets: '+e.message)}return}
  try{const d=await(await fetch('dados.json?t='+Date.now())).json();if(!d.geradoEm){if(!sil)toast(t('nodados'));return}fundir(d);render();document.getElementById('estado').textContent=t('upd')+d.geradoEm;if(!sil)toast(t('updated'))}catch(e){if(!sil)toast(t('nodados'))}}
function exportar(){const limpos=itens.map(i=>({...i,obs:(i.obs||[]).filter(o=>o.fonte!=='auto'),score:undefined,veredito:undefined,detalhe:undefined,precoAtual:undefined,moeda:undefined}));const b=new Blob([JSON.stringify({itens:limpos,compras},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='itens.json';a.click();toast(t('expmsg'))}
function importar(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);itens=d.itens||[];compras=d.compras||[];render();toast(t('updated'))}catch(e){toast('!')}};r.readAsText(f)}

/* ================= render ================= */
function render(){
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById('btnLang').textContent=lang==='pt'?'EN':'PT';document.documentElement.lang=lang==='pt'?'pt-PT':'en';
  const V={painel:vPainel,itens:vItens,acerto:vAcerto,cam:vCam,port:vPort,fontes:vFontes};
  Object.keys(V).forEach(k=>{const el=document.getElementById('v-'+k);el.classList.toggle('hide',k!==vista);if(k===vista)el.innerHTML=V[k]()});
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===vista));
  if(vista==='port')drawChart();save()}
const EXEMPLO={itens:[
 {id:'ex1',nome:'Evolving Skies booster box',tipo:'Booster box',set:'Evolving Skies',ano:2021,lang:'Inglês',producao:'fora',ultima_reimpressao:'2023-06',tipo_set:'principal',pop_psa10:null,proc:5,racio:2,img:null,links:[],notas:'',obs:[{data:'2026-03-01',fonte:'eBay',preco:520},{data:'2026-09-01',fonte:'Cardmarket',preco:690}]},
 {id:'ex2',nome:'Umbreon VMAX Alt Art 215/203',tipo:'Carta',set:'Evolving Skies',ano:2021,lang:'Inglês',producao:'fora',ultima_reimpressao:'2023-06',tipo_set:'principal',pop_psa10:1180,proc:5,img:'https://images.pokemontcg.io/swsh7/215_hires.png',links:[],notas:'',obs:[{data:'2026-01-10',fonte:'Cardmarket',preco:1350},{data:'2026-08-20',fonte:'eBay',preco:1420}]},
 {id:'ex3',nome:'Pokémon 151 ETB',tipo:'ETB',set:'151',ano:2023,lang:'Inglês',producao:'em',tipo_set:'especial',pop_psa10:null,proc:4,img:null,links:[],notas:'',obs:[{data:'2026-04-01',fonte:'Loja',preco:92},{data:'2026-09-01',fonte:'Loja',preco:95}]},
 {id:'ex4',nome:'Prismatic Evolutions ETB',tipo:'ETB',set:'Prismatic Evolutions',ano:2025,lang:'Inglês',producao:'em',tipo_set:'especial',pop_psa10:null,proc:4,img:null,links:[],notas:'',obs:[{data:'2026-05-01',fonte:'Loja',preco:95},{data:'2026-09-01',fonte:'Loja',preco:88}]}],
 compras:[{id:'c1',itemId:'ex1',data:'2025-09-15',qtd:1,preco:530,estado:'Selado',local:'Cardmarket'},{id:'c2',itemId:'ex2',data:'2026-01-12',qtd:1,preco:1300,estado:'Near Mint',local:'Cardmarket'}]};
(async()=>{if(shOn()){try{await shGet()}catch(e){load()}}else if(!load()){try{const d=await(await fetch('itens.json')).json();itens=d.itens||[];compras=d.compras||[]}catch(e){}}if(!itens.length&&!shOn()){itens=EXEMPLO.itens;compras=EXEMPLO.compras}render();if(!shOn())atualizar(true);else document.getElementById('estado').textContent='Google Sheets · '+hoje();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
